
name: Build and Release Jerk Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Ubuntu release from tag
        id: release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v[0-9]{8}_([a-z0-9]+)$ ]]; then
            RELEASE="${BASH_REMATCH[1]}"
          else
            echo "Invalid tag format: $TAG"
            echo "Expected: vYYYYMMDD_RELEASE (e.g. v20261115_noble)"
            exit 1
          fi

          echo "Ubuntu release: $RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DJERK_PACKAGE_RELEASE=${{ steps.release.outputs.release }} \
            -DJERK_PACKAGES_OUTPUT_DIR="$PWD/build/packages"

      - name: Build packages
        run: |
          cmake --build build --target jerk-packages

      - name: Verify generated packages
        shell: bash
        run: |
          if ! compgen -G "build/packages/*.jerk" > /dev/null; then
            echo "No Jerk packages were generated!"
            exit 1
          fi

          ls -lh build/packages/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/packages/*.jerk
